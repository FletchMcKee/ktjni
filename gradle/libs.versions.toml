[versions]
agp = "9.5.0"
asm = "9.11.1"
assertk = "0.28.1"
# Used in tests
#noinspection UnusedVersionCatalogEntry
compileSdk = "37"
junitJupiter = "6.1.3"
kotlin = "2.4.21"
ktjni = "1.0.0-SNAPSHOT"
ktlint = "1.6.0"
mavenPublish = "0.37.0"
# Used in tests
#noinspection UnusedVersionCatalogEntry
minSdk = "26"
# Used in tests
#noinspection UnusedVersionCatalogEntry
scala = "3.8.4"
shadow = "9.6.1"
spotless = "8.10.4"

[libraries]
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# Used in convention plugins
#noinspection UnusedVersionCatalogEntry
ktlint-core = { module = "com.pinterest.ktlint:ktlint-core", version.ref = "ktlint" }

# build-logic dependencies
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-api-gradlePlugin = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
shadow-gradlePlugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version = "0.18.2" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Used in convention plugins
#noinspection UnusedVersionCatalogEntry
ktjni = { id = "io.github.fletchmckee.ktjni", version.ref = "ktjni" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

# Custom plugins
ktjni-root = { id = "io.github.fletchmckee.ktjni.root" }
ktjni-spotless = { id = "io.github.fletchmckee.ktjni.spotless" }
ktjni-shadow = { id = "io.github.fletchmckee.ktjni.shadow" }
